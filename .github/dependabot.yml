version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      # client-go, apimachinery and api move together.
      kubernetes:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]
      charm:
        patterns: ["github.com/charmbracelet/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
