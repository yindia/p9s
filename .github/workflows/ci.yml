name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "Formula/**"
      - "docs/image/**"
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Go caching: setup-go's built-in cache is one key per go.sum shared by every
# job, so the first job to finish (lint, with a small build cache) wins and
# every go.sum change starts cold. Instead each job restores its own cache,
# falling back to its latest one, and saves from main only, so pull requests
# read main's cache instead of filling the quota.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - name: Restore Go cache
        id: go-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-lint-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-lint-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-lint-
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Save Go cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - name: Restore Go cache
        id: go-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-test-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-test-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-test-
      - name: Build
        run: make build
      # One run: make cover is go test -race with a coverage profile.
      - name: Test (unit, contract, golden, boundaries; race, coverage)
        run: make cover
      - name: Goldens are up to date
        run: |
          make golden
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: Save Go cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  e2e:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - name: Restore Go cache
        id: go-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-e2e-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-e2e-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-e2e-
      # kind from the Go module proxy (and the Go cache) rather than a
      # release download: helm/kind-action's checksum step failed on CI.
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.31.0
      - uses: azure/setup-helm@v5
      - name: Cluster (Gatekeeper, Kyverno, VAPs, demo workloads)
        run: make e2e-up
      - name: e2e
        id: e2e
        run: go test -tags e2e -count=1 -v ./test/e2e/...
        env:
          E2E_CONTEXT: kind-p9s
      - name: Save Go cache
        # Only once the tests ran (pass or fail): a job that died during
        # setup has an almost empty cache, which would shadow a full one.
        if: >-
          always() && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure')
          && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl --context kind-p9s get pods -A
          kubectl --context kind-p9s get events -A --sort-by=.lastTimestamp | tail -100
      - name: Delete the cluster
        if: always()
        run: make e2e-down
