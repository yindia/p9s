name: goreleaser-dryrun

on:
  push:
    branches: [main]
    paths-ignore:
      - "Formula/**"
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dryrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      # No `goreleaser check`: it exits non-zero on deprecation warnings, and
      # `brews` (the Formula/p9s.rb formula) is deprecated in favour of casks.
      # The snapshot below parses the same config and fails on real errors.
      - name: GoReleaser dry-run
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --skip=publish --clean
