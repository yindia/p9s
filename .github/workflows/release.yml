name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # create the release and commit Formula/p9s.rb

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Test
        run: go test ./...
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # The formula is bumped in this same repository, which the
          # workflow token may write to; no personal access token needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
