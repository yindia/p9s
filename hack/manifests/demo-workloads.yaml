# Violating workloads for the e2e cluster (see hack/e2e-setup.sh).
apiVersion: v1
kind: Namespace
metadata:
  name: p9s-demo
  labels:
    owner: demo.agilebank.demo
    team: platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: p9s-demo
  labels:
    team: payments
spec:
  replicas: 3
  selector:
    matchLabels: {app.kubernetes.io/name: checkout}
  template:
    metadata:
      labels: {app.kubernetes.io/name: checkout}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      automountServiceAccountToken: false
      containers:
        - name: web
          # Gatekeeper 3.23 enforces its CEL templates through generated
          # ValidatingAdmissionPolicies, which ignore the Config exclusion,
          # so the pod satisfies those (security context) and violates the
          # audit-only Rego ones instead: no resource limits or requests, no
          # probes, an image outside the allowed repos. Every replica
          # violates the same policies, which is what grouping collapses.
          image: busybox:1.36
          command: ["sleep", "infinity"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
