apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatekeeper-controller-manager
  namespace: gatekeeper-system
  labels:
    gatekeeper.sh/system: "yes"
spec:
  replicas: 3
  selector: {matchLabels: {control-plane: controller-manager}}
  template:
    spec:
      containers:
        - name: manager
          image: openpolicyagent/gatekeeper:v3.17.1
          args: ["--operation=webhook", "--emit-admission-events=true"]
status:
  readyReplicas: 2
