apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: gatekeeper-validating-webhook-configuration
  labels: {gatekeeper.sh/system: "yes"}
webhooks:
  - name: validation.gatekeeper.sh
    failurePolicy: Ignore
    timeoutSeconds: 3
    clientConfig:
      service: {namespace: gatekeeper-system, name: gatekeeper-webhook-service}
      caBundle: 
    namespaceSelector:
      matchExpressions:
        - {key: admission.gatekeeper.sh/ignore, operator: DoesNotExist}
    rules:
      - {apiGroups: ["*"], apiVersions: ["*"], operations: [CREATE, UPDATE], resources: ["*"]}
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: gatekeeper-webhook-service-x7k2p
  namespace: gatekeeper-system
  labels: {kubernetes.io/service-name: gatekeeper-webhook-service}
addressType: IPv4
endpoints:
  - addresses: [10.0.0.11]
    conditions: {ready: true}
    targetRef: {kind: Pod, namespace: gatekeeper-system, name: gatekeeper-controller-manager-5d8f-a}
  - addresses: [10.0.0.12]
    conditions: {ready: false}
    targetRef: {kind: Pod, namespace: gatekeeper-system, name: gatekeeper-controller-manager-5d8f-b}
---
