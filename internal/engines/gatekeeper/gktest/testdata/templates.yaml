apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequiredlabels
  creationTimestamp: "2026-11-01T10:00:00Z"
  annotations:
    metadata.gatekeeper.sh/title: Required Labels
    description: >-
      Requires resources to contain specified labels, with values matching
      provided regular expressions.
spec:
  crd:
    spec:
      names:
        kind: K8sRequiredLabels
      validation:
        openAPIV3Schema:
          type: object
          properties:
            labels:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequiredlabels

        violation[{"msg": msg}] {
          provided := {label | input.review.object.metadata.labels[label]}
          required := {label | label := input.parameters.labels[_]}
          missing := required - provided
          count(missing) > 0
          msg := sprintf("you must provide labels: %v", [missing])
        }
status:
  created: true
  byPod:
    - id: gatekeeper-audit-1
      operations: [audit]
      observedGeneration: 1
---
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sreplicalimits
  creationTimestamp: "2026-11-05T10:00:00Z"
spec:
  crd:
    spec:
      names:
        kind: K8sReplicaLimits
  targets:
    - target: admission.k8s.gatekeeper.sh
      code:
        - engine: K8sNativeValidation
          source:
            variables:
              - name: replicas
                expression: "has(object.spec.replicas) ? object.spec.replicas : 1"
            validations:
              - expression: "variables.replicas <= 10"
                message: "too many replicas"
status:
  created: true
---
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sbroken
  creationTimestamp: "2026-11-07T10:00:00Z"
spec:
  crd:
    spec:
      names:
        kind: K8sBroken
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sbroken
        violation[{"msg": msg}] { msg := }
status:
  created: false
  byPod:
    - id: gatekeeper-controller-1
      errors:
        - code: ingest_error
          message: "rego_parse_error: unexpected } token"
