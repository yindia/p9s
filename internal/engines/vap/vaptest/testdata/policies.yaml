# A native policy, bound with Deny for the payments namespace.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: require-team
  creationTimestamp: "2026-11-01T10:00:00Z"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
  validations:
    - expression: "has(object.metadata.labels) && 'team' in object.metadata.labels"
      message: "label team is required"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: require-team-payments
  creationTimestamp: "2026-11-01T10:01:00Z"
spec:
  policyName: require-team
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: payments}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: require-team-audit
  creationTimestamp: "2026-11-01T10:02:00Z"
spec:
  policyName: require-team
  validationActions: [Audit, Warn]
---
# A parameterised policy: one binding's param exists, the other's does not.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: replica-limit
  creationTimestamp: "2026-11-02T10:00:00Z"
spec:
  failurePolicy: Ignore
  paramKind: {apiVersion: v1, kind: ConfigMap}
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
  validations:
    - expression: "object.spec.replicas <= int(params.data.max)"
      messageExpression: "'at most ' + params.data.max + ' replicas'"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: replica-limit-default
  creationTimestamp: "2026-11-02T10:01:00Z"
spec:
  policyName: replica-limit
  validationActions: [Warn]
  paramRef: {name: replica-limits, namespace: default, parameterNotFoundAction: Deny}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: replica-limit-missing
  creationTimestamp: "2026-11-02T10:02:00Z"
spec:
  policyName: replica-limit
  validationActions: [Warn]
  paramRef: {name: no-such-limits, namespace: default, parameterNotFoundAction: Deny}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: replica-limits, namespace: default}
data: {max: "5"}
---
# Never bound, and its CEL has a type-checking warning.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: unbound-policy
  creationTimestamp: "2026-11-03T10:00:00Z"
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["configmaps"]
  validations:
    - expression: "object.data.size() < 10"
status:
  typeChecking:
    expressionWarnings:
      - fieldRef: spec.validations[0].expression
        warning: "no such key: size"
---
# A binding whose policy does not exist.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: dangling
  creationTimestamp: "2026-11-04T10:00:00Z"
spec:
  policyName: deleted-policy
  validationActions: [Deny]
